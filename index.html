<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتب التسليم الفني — مجمع الأميرات 2</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.webp" type="image/webp">
<link rel="apple-touch-icon" href="icon-192.webp">
<meta name="theme-color" content="#1E1A4D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مكتب التسليم">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3FA; --card:#FFFFFF; --ink:#19173A; --muted:#5B5878; --line:#E4E2F0; --soft:#F1F0F8; --soft2:#F7F6FC;
  --side:#1E1A4D; --side-ink:#ECEAF8; --side-muted:#BDB8E6;
  --brand:#3B2F8F; --brand-ink:#FFFFFF; --gold:#C9A24B;
  --ready:#C98A1B; --ready-bg:#FBEFD6; --ready-fg:#7A5410;
  --notready:#C2410C; --notready-bg:#FBE5DA; --notready-fg:#9A3412;
  --review:#7C5CE0; --ok:#13703F; --ok-bg:#EEF8F2; --info:#2563EB; --info-bg:#E6EEFD;
  --shadow:0 1px 2px rgba(25,23,58,.05),0 6px 20px -12px rgba(25,23,58,.25);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0E1F; --card:#1A1833; --ink:#F1F0FA; --muted:#A9A6C8; --line:#2C2950; --soft:#232046; --soft2:#1F1C3D;
  --side:#14122B; --brand:#8B80F0; --brand-ink:#14122B;
  --ready:#E2AC47; --ready-bg:#3A2E12; --ready-fg:#F3CD80;
  --notready:#F0703A; --notready-bg:#3D1C10; --notready-fg:#F7A67F;
  --review:#A993F5; --ok:#4ADE80; --ok-bg:#12301F; --info:#7EA6FF; --info-bg:#162447;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F0E1F; --card:#1A1833; --ink:#F1F0FA; --muted:#A9A6C8; --line:#2C2950; --soft:#232046; --soft2:#1F1C3D;
  --side:#14122B; --brand:#8B80F0; --brand-ink:#14122B;
  --ready:#E2AC47; --ready-bg:#3A2E12; --ready-fg:#F3CD80;
  --notready:#F0703A; --notready-bg:#3D1C10; --notready-fg:#F7A67F;
  --review:#A993F5; --ok:#4ADE80; --ok-bg:#12301F; --info:#7EA6FF; --info-bg:#162447;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,.disp{font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif}
a{color:var(--brand)}
.ltr{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ---------- shell ---------- */
#app{display:flex;min-height:100vh}
#rail{position:fixed;inset-block:0;inset-inline-start:0;width:76px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:14px;padding:16px 12px;z-index:40;transition:width .18s ease;overflow:hidden}
#rail.open{width:252px;box-shadow:0 0 0 100vmax rgba(10,8,30,.35)}
#rail .logo{display:flex;align-items:center;gap:10px;min-height:52px}
#rail .logo button{flex:none;width:52px;height:52px;border-radius:15px;border:0;background:#fff;padding:3px;display:flex;align-items:center;justify-content:center}
#rail .logo img{width:100%;height:100%;object-fit:contain;border-radius:12px}
#rail .logo .t{white-space:nowrap}
#rail .logo .t b{display:block;font-family:'Readex Pro';font-weight:600;font-size:15px}
#rail .logo .t small{color:var(--side-muted);font-size:12px}
#rail nav{display:flex;flex-direction:column;gap:4px;overflow-y:auto;overflow-x:hidden}
.navbtn{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;padding:0 13px;border-radius:12px;border:0;background:transparent;color:#D9D6F2;text-align:right;white-space:nowrap;width:100%}
.navbtn svg{flex:none;width:22px;height:22px}
.navbtn.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.navbtn:hover{background:rgba(255,255,255,.08)}
.navbtn .lbl{opacity:0;transition:opacity .12s}
#rail.open .navbtn .lbl{opacity:1}
.navbtn .bdg{position:absolute;top:5px;inset-inline-start:30px;background:var(--notready);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px}
#rail .foot{margin-top:auto;font-size:11px;color:var(--side-muted);text-align:center;direction:ltr;white-space:nowrap}
#main{flex:1;min-width:0;margin-inline-start:76px;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#topbar h1{margin:0;font-size:20px;font-weight:700;flex:1;min-width:180px}
#topbar h1 small{display:block;font-family:'IBM Plex Sans Arabic';font-weight:400;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:99px;background:var(--ok);flex:none}
.dot.off{background:var(--notready)}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn .bdg{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--notready);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px}
#view{padding:22px 24px 60px;display:flex;flex-direction:column;gap:18px;max-width:1500px;width:100%}

/* ---------- common ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card h2 small{font-family:'IBM Plex Sans Arabic';font-weight:400;font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.wa{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.btn.danger{background:var(--notready-bg);color:var(--notready-fg);border-color:color-mix(in srgb,var(--notready) 35%,transparent)}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.p-ready{background:var(--ready-bg);color:var(--ready-fg)}
.p-not{background:var(--notready-bg);color:var(--notready-fg)}
.p-rev{background:color-mix(in srgb,var(--review) 16%,transparent);color:var(--review)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-info{background:var(--info-bg);color:var(--info)}
.p-admin{background:#FBEFD6;color:#7A5410}
.p-mut{background:var(--soft);color:var(--muted)}
input.inp,select.inp,textarea.inp{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:14px;outline:none;min-width:0}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
label.fld .inp{color:var(--ink)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:right;font-weight:600;color:var(--muted);padding:11px 10px;background:var(--soft2);position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr.grp td{background:var(--soft);font-weight:700;color:var(--brand)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.empty{padding:24px;text-align:center;color:var(--muted)}
dl.kv{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px 16px}
dl.kv>div{display:flex;flex-direction:column;gap:2px;padding-bottom:8px;border-bottom:1px solid var(--line)}
dl.kv dt{font-size:12.5px;color:var(--muted)}
dl.kv dd{margin:0;font-size:15px;font-weight:600;unicode-bidi:plaintext}

/* ---------- KPIs + charts ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:right;box-shadow:var(--shadow)}
.kpi .k{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.kpi .k i{width:10px;height:10px;border-radius:3px;display:inline-block}
.kpi .v{font-family:'Readex Pro';font-size:32px;font-weight:700;line-height:1}
.kpi .s{font-size:12.5px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:10px;height:190px;border-bottom:1px solid var(--line);padding-top:16px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;border:0;background:transparent;padding:0;min-width:0}
.bars .b span{font-size:12px;font-weight:700}
.bars .b i{display:block;width:100%;max-width:38px;border-radius:7px 7px 2px 2px;background:var(--brand)}
.bars-x{display:flex;gap:10px;font-size:11.5px;color:var(--muted);padding-top:6px}
.bars-x span{flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 46px;align-items:center;gap:10px;font-size:13.5px;border:0;background:transparent;padding:4px 0;width:100%;text-align:right}
.hbar .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--soft)}
.hbar .tr i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- towers ---------- */
.sector-chips{display:flex;gap:8px;flex-wrap:wrap}
.secchip{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.secchip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.secchip b{font-size:12px;background:var(--soft);color:var(--muted);border-radius:99px;padding:1px 8px}
.secchip.on b{background:rgba(255,255,255,.2);color:inherit}
.sector{border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
.sector>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:var(--soft2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.sector>header h3{margin:0;font-size:16px}
.towers{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;padding:20px 18px 16px}
.tower{display:flex;flex-direction:column;align-items:center;min-width:92px;max-width:140px}
.tower .stack{display:flex;flex-direction:column-reverse;gap:3px;border-radius:10px 10px 4px 4px;overflow:hidden;width:100%;border:1px solid var(--line);box-shadow:0 10px 22px -14px rgba(0,0,0,.5)}
.floor{height:28px;border:0;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;direction:ltr}
.floor.r{background:var(--ready)}
.floor.n{background:var(--notready)}
.floor.rv{box-shadow:inset 0 0 0 3px var(--review)}
.floor:focus-visible{outline:3px solid var(--brand);outline-offset:-3px}
.tower .nm{margin-top:9px;font-size:12.5px;font-weight:700;text-align:center;line-height:1.35;color:var(--brand)}
.tower .ct{font-size:12px;color:var(--muted)}

/* ---------- search ---------- */
.bigsearch{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--brand);border-radius:16px;padding:0 18px;height:62px}
.bigsearch input{border:0;outline:0;background:transparent;font-size:20px;font-weight:600;flex:1;min-width:0}
.split{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.split>.l{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 230px);overflow:auto;padding-inline-end:4px}
.split>.r{flex:999 1 520px;min-width:0}
.res{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:right;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);min-height:60px;width:100%}
.res.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--card))}
.res .no{font-family:'Readex Pro';font-weight:700;font-size:17px;direction:ltr;unicode-bidi:isolate}
.res small{display:block;color:var(--muted);font-size:12.5px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.hcard>header{background:var(--side);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hcard>header .no{font-family:'Readex Pro';font-size:34px;font-weight:700;direction:ltr;unicode-bidi:isolate}
.hcard>header small{color:#D9D6F2;font-size:14px;display:block}
.hcard>.bd{padding:18px 22px;display:flex;flex-direction:column;gap:18px}
.readyseg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.readyseg button{height:62px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:18px;font-weight:700}
.readyseg button.r.on{background:var(--ready);border-color:var(--ready);color:#fff}
.readyseg button.n.on{background:var(--notready);border-color:var(--notready);color:#fff}
.rounds{display:flex;flex-direction:column;gap:8px}
.round{display:flex;flex-direction:column;gap:4px;background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.round .h{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:14px}
.round .h b{color:var(--brand)}
.round .n{font-size:13.5px;color:var(--muted);white-space:pre-wrap;unicode-bidi:plaintext}

/* ---------- alerts ---------- */
.alist{display:flex;flex-direction:column;gap:8px}
.aitem{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--soft2);border:1px solid var(--line);text-align:right;width:100%}
.aitem .bar{width:6px;align-self:stretch;border-radius:4px}
.aitem .m{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.aitem .m b{font-size:15px;unicode-bidi:plaintext}
.aitem .m small{color:var(--muted);font-size:12.5px;unicode-bidi:plaintext}
.aitem .w{font-weight:700;font-size:13px}
details.sec{border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .c{margin-inline-start:auto;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px}
details.sec>.in{padding:0 14px 14px}
.banner{border-radius:16px;padding:14px 16px;border:1px solid}
.banner.new{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 35%,transparent)}
.banner.del{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.banner h3{margin:0 0 8px;font-size:15.5px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(12,10,32,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal .box{background:var(--card);border-radius:20px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.modal .box.wide{width:min(760px,100%)}
.modal header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.modal header h3{margin:0;font-size:17px}
.modal .bd{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}
.modal footer .btn{flex:1}
.pre{white-space:pre-wrap;background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;unicode-bidi:plaintext;max-height:260px;overflow:auto}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{padding:12px 20px;border-radius:12px;font-weight:700;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:90vw;text-align:center}

/* ---------- login ---------- */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#1E1A4D,#2E2670 60%,#3B2F8F);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px}
#login .box{background:var(--card);border-radius:24px;padding:28px;width:min(440px,100%);display:flex;flex-direction:column;gap:16px;align-items:stretch;text-align:center;box-shadow:0 40px 90px -30px rgba(0,0,0,.7)}
#login img{width:96px;height:96px;object-fit:contain;margin:0 auto}
#login h2{margin:0;font-size:22px}
#login .users{display:flex;flex-direction:column;gap:10px}
#login .users button{height:54px;border-radius:14px;border:1px solid var(--line);background:var(--soft2);font-weight:700;font-size:16px}
#login .pin{height:60px;font-size:26px;letter-spacing:12px;text-align:center;border-radius:14px;border:2px solid var(--line);background:var(--card);direction:ltr}
#login .err{color:var(--notready);font-weight:600;min-height:22px}
#login .credit{font-size:12px;color:var(--muted);direction:ltr}

@media (max-width:760px){
  #view{padding:16px}
  #topbar{padding:10px 16px}
  .split>.l{max-height:none}
}
@media print{#rail,#topbar,.noprint{display:none!important}#main{margin:0}}
</style>
</head>
<body>
<div id="login" class="hidden"></div>
<div id="app">
  <aside id="rail" aria-label="القائمة الرئيسية"></aside>
  <div id="main">
    <header id="topbar"></header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
