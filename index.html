<!doctype html>
<html lang="ar" dir="rtl" data-mode="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتب التسليم الفني — مجمع الأميرات 2</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.webp" type="image/webp">
<link rel="apple-touch-icon" href="icon-192.webp">
<meta name="theme-color" content="#060A18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مكتب التسليم">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3FA; --card:#FFFFFF; --ink:#19173A; --muted:#5B5878; --line:#E4E2F0; --soft:#F1F0F8; --soft2:#F7F6FC;
  --side:#1E1A4D; --side-ink:#ECEAF8; --side-muted:#BDB8E6;
  --brand:#3B2F8F; --brand-ink:#FFFFFF; --gold:#C9A24B;
  --ready:#C98A1B; --ready-bg:#FBEFD6; --ready-fg:#7A5410;
  --notready:#C2410C; --notready-bg:#FBE5DA; --notready-fg:#9A3412;
  --review:#7C5CE0; --ok:#13703F; --ok-bg:#EEF8F2; --info:#2563EB; --info-bg:#E6EEFD;
  --shadow:0 1px 2px rgba(25,23,58,.05),0 6px 20px -12px rgba(25,23,58,.25);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0E1F; --card:#1A1833; --ink:#F1F0FA; --muted:#A9A6C8; --line:#2C2950; --soft:#232046; --soft2:#1F1C3D;
  --side:#14122B; --brand:#8B80F0; --brand-ink:#14122B;
  --ready:#E2AC47; --ready-bg:#3A2E12; --ready-fg:#F3CD80;
  --notready:#F0703A; --notready-bg:#3D1C10; --notready-fg:#F7A67F;
  --review:#A993F5; --ok:#4ADE80; --ok-bg:#12301F; --info:#7EA6FF; --info-bg:#162447;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F0E1F; --card:#1A1833; --ink:#F1F0FA; --muted:#A9A6C8; --line:#2C2950; --soft:#232046; --soft2:#1F1C3D;
  --side:#14122B; --brand:#8B80F0; --brand-ink:#14122B;
  --ready:#E2AC47; --ready-bg:#3A2E12; --ready-fg:#F3CD80;
  --notready:#F0703A; --notready-bg:#3D1C10; --notready-fg:#F7A67F;
  --review:#A993F5; --ok:#4ADE80; --ok-bg:#12301F; --info:#7EA6FF; --info-bg:#162447;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,.disp{font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif}
a{color:var(--brand)}
.ltr{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ---------- shell ---------- */
#app{display:flex;min-height:100vh}
#rail{position:fixed;inset-block:0;inset-inline-start:0;width:76px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:14px;padding:16px 12px;z-index:40;transition:width .18s ease;overflow:hidden}
#rail.open{width:252px;box-shadow:0 0 0 100vmax rgba(10,8,30,.35)}
#rail .logo{display:flex;align-items:center;gap:10px;min-height:52px}
#rail .logo button{flex:none;width:52px;height:52px;border-radius:15px;border:0;background:#fff;padding:3px;display:flex;align-items:center;justify-content:center}
#rail .logo img{width:100%;height:100%;object-fit:contain;border-radius:12px}
#rail .logo .t{white-space:nowrap}
#rail .logo .t b{display:block;font-family:'Readex Pro';font-weight:600;font-size:15px}
#rail .logo .t small{color:var(--side-muted);font-size:12px}
#rail nav{display:flex;flex-direction:column;gap:4px;overflow-y:auto;overflow-x:hidden}
.navbtn{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;padding:0 13px;border-radius:12px;border:0;background:transparent;color:#D9D6F2;text-align:right;white-space:nowrap;width:100%}
.navbtn svg{flex:none;width:22px;height:22px}
.navbtn.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.navbtn:hover{background:rgba(255,255,255,.08)}
.navbtn .lbl{opacity:0;transition:opacity .12s}
#rail.open .navbtn .lbl{opacity:1}
.navbtn .bdg{position:absolute;top:5px;inset-inline-start:30px;background:var(--notready);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px}
#rail .foot{margin-top:auto;font-size:11px;color:var(--side-muted);text-align:center;direction:ltr;white-space:nowrap}
#main{flex:1;min-width:0;margin-inline-start:0;display:flex;flex-direction:column}
/* القائمة صارت شريط منسحب: مخفي ويطلع بزر ☰ */
#rail:not(.open){transform:translateX(100%);visibility:hidden;box-shadow:none}
#rail{transition:transform .25s ease,visibility .25s,width .18s ease}
#rail.open{width:252px}
#topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#topbar h1{margin:0;font-size:20px;font-weight:700;flex:1;min-width:180px}
#topbar h1 small{display:block;font-family:'IBM Plex Sans Arabic';font-weight:400;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:99px;background:var(--ok);flex:none}
.dot.off{background:var(--notready)}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn .bdg{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--notready);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px}
#view{padding:22px 24px 60px;display:flex;flex-direction:column;gap:18px;max-width:1500px;width:100%}

/* ---------- common ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card h2 small{font-family:'IBM Plex Sans Arabic';font-weight:400;font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.wa{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.btn.danger{background:var(--notready-bg);color:var(--notready-fg);border-color:color-mix(in srgb,var(--notready) 35%,transparent)}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.p-ready{background:var(--ready-bg);color:var(--ready-fg)}
.p-not{background:var(--notready-bg);color:var(--notready-fg)}
.p-rev{background:color-mix(in srgb,var(--review) 16%,transparent);color:var(--review)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-info{background:var(--info-bg);color:var(--info)}
.p-admin{background:#FBEFD6;color:#7A5410}
.p-mut{background:var(--soft);color:var(--muted)}
input.inp,select.inp,textarea.inp{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:14px;outline:none;min-width:0}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
label.fld .inp{color:var(--ink)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:right;font-weight:600;color:var(--muted);padding:11px 10px;background:var(--soft2);position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr.grp td{background:var(--soft);font-weight:700;color:var(--brand)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.empty{padding:24px;text-align:center;color:var(--muted)}
dl.kv{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px 16px}
dl.kv>div{display:flex;flex-direction:column;gap:2px;padding-bottom:8px;border-bottom:1px solid var(--line)}
dl.kv dt{font-size:12.5px;color:var(--muted)}
dl.kv dd{margin:0;font-size:15px;font-weight:600;unicode-bidi:plaintext}

/* ---------- KPIs + charts ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:right;box-shadow:var(--shadow)}
.kpi .k{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.kpi .k i{width:10px;height:10px;border-radius:3px;display:inline-block}
.kpi .v{font-family:'Readex Pro';font-size:32px;font-weight:700;line-height:1}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi{cursor:pointer;transition:transform .12s,box-shadow .12s}
.kpi:hover{transform:translateY(-1px)}
.kpi.on{outline:3px solid var(--brand);outline-offset:-3px;background:color-mix(in srgb,var(--brand) 8%,var(--card))}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:8px}
.chip.net.on{border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok);font-weight:600}
.chip.net.off{border-color:color-mix(in srgb,var(--notready) 45%,transparent);color:var(--notready-fg);background:var(--notready-bg);font-weight:600;white-space:normal}
.credit{font-size:15.5px;color:var(--muted);white-space:nowrap;font-family:'Readex Pro',sans-serif}
.credit b{color:var(--brand);font-weight:700;font-size:17px}
.chip.net{height:28px;padding:0 10px;font-size:11.5px;gap:5px}
.chip.net .dot{width:7px;height:7px}
/* ---------- الشبكة الرئيسية (مستقبلية): مدار واحد، 8 أقسام متساوية، نواة أكبر ---------- */
#app.hubmode #topbar{background:transparent;border-bottom-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
#app.hubmode #view{padding:0;max-width:none}
.hub{position:relative;width:100%;height:var(--hubh,640px);overflow:hidden;color:var(--ink)}
.hub::before{content:"";position:absolute;left:var(--cx);top:var(--cy);width:calc(var(--R)*2.9);height:calc(var(--R)*2.9);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(79,216,232,.13),rgba(142,124,255,.07) 45%,transparent 70%);pointer-events:none}
.hub svg.web{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.hub .web .orbit{fill:none;stroke:rgba(79,216,232,.38);stroke-width:1}
.hub .web .orbit.o2{stroke:rgba(142,124,255,.28);stroke-dasharray:2 9;stroke-linecap:round;stroke-width:1.5}
.hub .web .orbit.o3{stroke:rgba(79,216,232,.12)}
.hub .web .tick{stroke:rgba(79,216,232,.35);stroke-width:1}
.hub .web .star{fill:none;stroke:url(#hg);stroke-width:1.15;stroke-linejoin:round;opacity:.85}
.hub .web .star.s2{opacity:.28}
.hub .web .spoke{stroke:rgba(150,200,255,.16);stroke-width:1;transition:stroke .25s,opacity .25s,stroke-width .25s}
.hub .web .spark{fill:#BFF6FF;filter:drop-shadow(0 0 4px #4FD8E8)}
.hub.focus .web .spoke:not(.hot),.hub.focus .web .star{opacity:.18}
.hub .web .spoke.hot{stroke:#7FEAF5;stroke-width:2;filter:drop-shadow(0 0 6px #4FD8E8)}
.hub .core,.hub .node{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hub .core{z-index:2;gap:calc(7px*var(--k));background:radial-gradient(circle at 50% 30%,#18295A 0,#0C1533 60%,#080F26 100%);
  box-shadow:0 0 0 1px rgba(79,216,232,.7),0 0 0 8px rgba(6,10,24,.9),0 0 0 9px rgba(142,124,255,.45),0 0 70px 6px rgba(79,216,232,.22)}
.hub .core .seal{width:36%;aspect-ratio:1;border-radius:50%;background:#FBF8EF;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(226,196,122,.85),0 0 0 4px #0C1533,0 0 0 5px rgba(79,216,232,.5),0 0 30px -4px rgba(79,216,232,.6)}
.hub .core .seal img{width:86%;height:86%;object-fit:contain}
.hub .core b{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:calc(25px*var(--k));line-height:1.15;color:#EAF4FF}
.hub .core small{font-size:calc(13.5px*var(--k));color:var(--gold)}
.hub .node{z-index:3;border:0;color:var(--ink);cursor:pointer;gap:calc(4px*var(--k));padding:0;background:radial-gradient(circle at 50% 25%,rgba(40,64,130,.95),rgba(10,18,44,.96) 72%);box-shadow:0 18px 36px -18px #000;transition:transform .25s ease}
.hub .node .rg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.hub .node .rg circle{fill:none}
.hub .node .rg .trk{stroke:rgba(110,170,255,.22);stroke-width:1.5}
.hub .node .rg .arc{stroke:url(#ag);stroke-width:3.2;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.3,0,.2,1)}
.hub .node.alert .rg .arc{stroke:#FF5A72}
.hub .node::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(79,216,232,.45);animation:breathe var(--br,4.2s) ease-in-out infinite;animation-delay:var(--bd,0s);pointer-events:none}
.hub .node.alert::after{border-color:rgba(255,90,114,.7);--br:1.7s}
@keyframes breathe{0%,100%{opacity:.15;transform:scale(.97)}50%{opacity:.85;transform:scale(1.04)}}
.hub .node svg.i{width:calc(26px*var(--k));height:calc(26px*var(--k));color:#7FEAF5;stroke-width:1.6}
.hub .node .l{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:calc(16px*var(--k));line-height:1.25;position:relative;color:#F2F7FF;text-shadow:0 1px 2px rgba(0,0,0,.55);letter-spacing:0}
.hub .node .c{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:600;font-size:calc(12.5px*var(--k));color:#C5D3EE;line-height:1.2;position:relative;font-variant-numeric:tabular-nums}
.hub .node:hover,.hub .node:focus-visible{outline:none;transform:translate(-50%,-50%) scale(1.06)}
.hub .node:focus-visible::after{border-color:#BFF6FF;opacity:1;animation:none}
.hub .node .bdg{position:absolute;top:1%;inset-inline-end:1%;background:linear-gradient(135deg,#FF5A72,#E33A63);color:#fff;font-size:calc(12px*var(--k));font-weight:700;min-width:calc(25px*var(--k));height:calc(25px*var(--k));border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 0 0 2px var(--bg),0 0 16px -2px #FF5A72;z-index:2}
.hub .gear{position:absolute;bottom:18px;inset-inline-start:22px;z-index:4;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:rgba(110,170,255,.06);color:#7FEAF5;font-size:13.5px}
.hub .gear svg{width:18px;height:18px}
.hub.anim .node{animation:hubIn .85s cubic-bezier(.2,.85,.25,1.08) backwards}
.hub.anim .core{animation:coreIn .7s ease-out backwards}
.hub.anim .web .star,.hub.anim .web .orbit{stroke-dasharray:var(--len) var(--len);stroke-dashoffset:var(--len);animation:draw 1.4s cubic-bezier(.6,0,.2,1) .35s forwards}
.hub.anim .web .orbit.o2,.hub.anim .web .spoke,.hub.anim .web .tick,.hub.anim .web .spark{animation:fadeIn 1s ease-out 1s backwards}
.hub.anim .node .rg .arc{stroke-dashoffset:var(--full)!important}
.hub.back .node:not(.from){animation:fadeIn .45s ease-out .1s backwards}
.hub.back .node.from{animation:hubBack .45s cubic-bezier(.2,.8,.2,1) backwards}
.hub.back .core,.hub.back svg{animation:fadeIn .4s ease-out backwards}
@keyframes hubIn{from{left:var(--cx);top:var(--cy);opacity:0;filter:blur(12px);transform:translate(-50%,-50%) scale(.3)}}
@keyframes hubBack{from{transform:translate(-50%,-50%) scale(4);opacity:0;filter:blur(8px)}}
@keyframes coreIn{from{opacity:0;filter:blur(14px);transform:translate(-50%,-50%) scale(.7)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}}
.hub.leaving .node:not(.go),.hub.leaving .core,.hub.leaving svg.web,.hub.leaving .gear{transition:opacity .3s,filter .3s;opacity:0;filter:blur(8px)}
#view.exit{transition:opacity .25s ease,transform .25s ease,filter .25s ease;opacity:0;transform:scale(.92);filter:blur(6px)}
@media (max-width:560px){.hub .node .c{display:none}.hub .gear{bottom:12px;inset-inline-start:12px}}
.hub .node.go{transition:transform .38s cubic-bezier(.5,0,.7,.4),opacity .38s,filter .38s;transform:translate(-50%,-50%) scale(5);opacity:0;filter:blur(6px);z-index:9}
#view.enter{animation:viewIn .35s ease-out}
@keyframes viewIn{from{opacity:0;filter:blur(6px);transform:scale(.97)}}
@media (prefers-reduced-motion:reduce){.hub.anim .node,.hub.anim .core,.hub.anim .web *,.hub.back *,.hub .node::after,#view.enter{animation:none!important}.hub .node.go,#view.exit{transition:none}.hub .web .spark{display:none}}
.bars{display:flex;align-items:flex-end;gap:10px;height:190px;border-bottom:1px solid var(--line);padding-top:16px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;border:0;background:transparent;padding:0;min-width:0}
.bars .b span{font-size:12px;font-weight:700}
.bars .b i{display:block;width:100%;max-width:38px;border-radius:7px 7px 2px 2px;background:var(--brand)}
.bars-x{display:flex;gap:10px;font-size:11.5px;color:var(--muted);padding-top:6px}
.bars-x span{flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 46px;align-items:center;gap:10px;font-size:13.5px;border:0;background:transparent;padding:4px 0;width:100%;text-align:right}
.hbar .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--soft)}
.hbar .tr i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- towers ---------- */
.sector-chips{display:flex;gap:8px;flex-wrap:wrap}
.secchip{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.secchip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.secchip b{font-size:12px;background:var(--soft);color:var(--muted);border-radius:99px;padding:1px 8px}
.secchip.on b{background:rgba(255,255,255,.2);color:inherit}
.sector{border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
.sector>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:var(--soft2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.sector>header h3{margin:0;font-size:16px}
.towers{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;padding:20px 18px 16px}
.tower{display:flex;flex-direction:column;align-items:center;min-width:92px;max-width:140px}
.tower .stack{display:flex;flex-direction:column-reverse;gap:3px;border-radius:10px 10px 4px 4px;overflow:hidden;width:100%;border:1px solid var(--line);box-shadow:0 10px 22px -14px rgba(0,0,0,.5)}
.floor{height:28px;border:0;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;direction:ltr}
.floor.r{background:var(--ready)}
.floor.n{background:var(--notready)}
.floor.rv{box-shadow:inset 0 0 0 3px var(--review)}
.floor:focus-visible{outline:3px solid var(--brand);outline-offset:-3px}
.tower .nm{margin-top:9px;font-size:12.5px;font-weight:700;text-align:center;line-height:1.35;color:var(--brand)}
.tower .ct{font-size:12px;color:var(--muted)}

/* ---------- search ---------- */
.bigsearch{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--brand);border-radius:16px;padding:0 18px;height:62px}
.bigsearch input{border:0;outline:0;background:transparent;font-size:20px;font-weight:600;flex:1;min-width:0}
.split{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.split>.l{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 230px);overflow:auto;padding-inline-end:4px}
.split>.r{flex:999 1 520px;min-width:0}
.res{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:right;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);min-height:60px;width:100%}
.res.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--card))}
.res .no{font-family:'Readex Pro';font-weight:700;font-size:17px;direction:ltr;unicode-bidi:isolate}
.res small{display:block;color:var(--muted);font-size:12.5px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.hcard>header{background:var(--side);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hcard>header .no{font-family:'Readex Pro';font-size:34px;font-weight:700;direction:ltr;unicode-bidi:isolate}
.hcard>header small{color:#D9D6F2;font-size:14px;display:block}
.hcard>.bd{padding:18px 22px;display:flex;flex-direction:column;gap:18px}
.readyseg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.readyseg button{height:62px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:18px;font-weight:700}
.readyseg button.r.on{background:var(--ready);border-color:var(--ready);color:#fff}
.readyseg button.n.on{background:var(--notready);border-color:var(--notready);color:#fff}
.rounds{display:flex;flex-direction:column;gap:8px}
.round{display:flex;flex-direction:column;gap:4px;background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.round .h{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:14px}
.round .h b{color:var(--brand)}
.round .n{font-size:13.5px;color:var(--muted);white-space:pre-wrap;unicode-bidi:plaintext}

/* ---------- alerts ---------- */
.alist{display:flex;flex-direction:column;gap:8px}
.aitem{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--soft2);border:1px solid var(--line);text-align:right;width:100%}
.aitem .bar{width:6px;align-self:stretch;border-radius:4px}
.aitem .m{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.aitem .m b{font-size:15px;unicode-bidi:plaintext}
.aitem .m small{color:var(--muted);font-size:12.5px;unicode-bidi:plaintext}
.aitem .w{font-weight:700;font-size:13px}
details.sec{border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .c{margin-inline-start:auto;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px}
details.sec>.in{padding:0 14px 14px}
.banner{border-radius:16px;padding:14px 16px;border:1px solid}
.banner.new{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 35%,transparent)}
.banner.del{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.banner.wa{background:var(--card);border-color:color-mix(in srgb,#25D366 45%,transparent);border-width:1.5px}
.banner+.banner{margin-top:12px}
.chip.warn{border-color:color-mix(in srgb,#D97706 50%,transparent);color:#B45309;background:color-mix(in srgb,#F59E0B 14%,var(--card));font-weight:600}
.banner h3{margin:0 0 8px;font-size:15.5px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(12,10,32,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal .box{background:var(--card);border-radius:20px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.modal .box.wide{width:min(760px,100%)}
.modal header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.modal header h3{margin:0;font-size:17px}
.modal .bd{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}
.modal footer .btn{flex:1}
.pre{white-space:pre-wrap;background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;unicode-bidi:plaintext;max-height:260px;overflow:auto}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{padding:12px 20px;border-radius:12px;font-weight:700;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:90vw;text-align:center}

/* ---------- login ---------- */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#1E1A4D,#2E2670 60%,#3B2F8F);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px}
#login .box{background:var(--card);border-radius:24px;padding:28px;width:min(440px,100%);display:flex;flex-direction:column;gap:16px;align-items:stretch;text-align:center;box-shadow:0 40px 90px -30px rgba(0,0,0,.7)}
#login img{width:96px;height:96px;object-fit:contain;margin:0 auto}
#login h2{margin:0;font-size:22px}
#login .users{display:flex;flex-direction:column;gap:10px}
#login .users button{height:54px;border-radius:14px;border:1px solid var(--line);background:var(--soft2);font-weight:700;font-size:16px}
#login .pin{height:60px;font-size:26px;letter-spacing:12px;text-align:center;border-radius:14px;border:2px solid var(--line);background:var(--card);direction:ltr}
#login .err{color:var(--notready);font-weight:600;min-height:22px}
#login .credit{font-size:12px;color:var(--muted);direction:ltr}

@media (max-width:760px){
  #view{padding:16px}
  #topbar{padding:10px 16px}
  .split>.l{max-height:none}
}
/* ---------- موقف المقاولين: بطاقة لكل مقاول ---------- */
.cwsum{display:flex;flex-direction:column;gap:14px}
.cwhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.cwnums{display:flex;gap:18px;flex-wrap:wrap}
.cwnums span{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted)}
.cwnums b{font-family:'Readex Pro';font-size:26px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.cwnums.sm{gap:14px}.cwnums.sm b{font-size:18px}
.cwnums .d b{color:var(--ok)}.cwnums .p b{color:var(--ready)}.cwnums .r b{color:var(--notready)}
.cwbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--soft);gap:2px}
.cwbar.big{height:14px}
.cwbar i{display:block;height:100%;width:var(--w);border-radius:99px;transform-origin:right;animation:cwGrow .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms + .1s)}
.cwbar i.d{background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 70%,var(--brand)))}
.cwbar i.p{background:var(--ready)}.cwbar i.r{background:var(--notready);opacity:.85}
@keyframes cwGrow{from{transform:scaleX(0)}}
.cwsort{gap:8px}.cwsort .secchip{height:34px;font-size:13px}
.cwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:14px}
.cwcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);animation:cwIn .5s ease backwards;animation-delay:calc(var(--i)*45ms);position:relative;overflow:hidden}
.cwcard::before{content:"";position:absolute;inset-inline:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--brand),transparent);opacity:.5}
@keyframes cwIn{from{opacity:0;transform:translateY(10px)}}
.cwcard header{display:flex;align-items:center;gap:14px;position:relative}
.cwcard h3{margin:0;font-size:17px;font-family:'Reem Kufi','Readex Pro',sans-serif;font-weight:600}
.cwcard .nm span{font-size:12.5px}
.cwring{width:64px;height:64px;transform:rotate(-90deg);flex:none}
.cwring circle{fill:none;stroke-width:6}
.cwring .tk{stroke:var(--soft)}
.cwring .ar{stroke:var(--ok);stroke-linecap:round;stroke-dashoffset:var(--off);animation:cwRing 1.1s cubic-bezier(.3,0,.2,1) backwards;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--ok) 60%,transparent))}
@keyframes cwRing{from{stroke-dashoffset:var(--full)}}
.cwcard .rw{position:relative;width:64px;height:64px;flex:none}
.cwpct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Readex Pro';font-size:17px}
.cwpct small{font-size:11px;color:var(--muted)}
.cwsecs{list-style:none;margin:0;padding:10px 0 0;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.cwsecs li{display:grid;grid-template-columns:minmax(78px,auto) 1fr 52px;align-items:center;gap:10px;font-size:13px}
.cwsecs .s{color:var(--muted);white-space:nowrap}
.cwsecs .v{text-align:left;font-weight:700;font-variant-numeric:tabular-nums}.cwsecs .v small{color:var(--muted);font-weight:400}
@media (prefers-reduced-motion:reduce){.cwbar i,.cwcard,.cwring .ar{animation:none}}
/* ---------- الجرد السنوي ---------- */
.anhero{display:grid;grid-template-columns:minmax(200px,1fr) minmax(220px,1.1fr) minmax(260px,1.4fr);gap:20px;align-items:center}
.anhero .big{display:flex;flex-direction:column;gap:4px}
.anhero .big b{font-family:'Readex Pro';font-size:56px;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(120deg,var(--brand),var(--brand2,#8E7CFF));-webkit-background-clip:text;background-clip:text;color:transparent}
.anhero .dl{font-size:13px;font-weight:700}.anhero .dl.up{color:var(--ok)}.anhero .dl.dn{color:var(--notready)}
.anhero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.anhero .stats span{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);padding:10px;border-radius:14px;background:var(--soft2);border:1px solid var(--line)}
.anhero .stats b{font-family:'Readex Pro';font-size:20px;color:var(--ink)}
.anhero .cats{display:flex;flex-direction:column;gap:8px}
.anhero .cat{display:grid;grid-template-columns:12px 60px 44px 40px 1fr;align-items:center;gap:8px;font-size:13px}
.anhero .cat .sw{width:12px;height:12px;border-radius:4px}
.anhero .cat b{font-variant-numeric:tabular-nums}.anhero .cat .pc{color:var(--muted)}
.anhero .cat .ln{height:7px;border-radius:99px;background:var(--soft);overflow:hidden}.anhero .cat .ln i{display:block;height:100%;border-radius:99px;animation:cwGrow .9s ease backwards;transform-origin:right}
.anchart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;height:260px;align-items:end;padding-top:10px}
.anchart .col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;border:0;background:transparent;padding:0 0 24px;border-radius:12px;color:var(--ink);cursor:pointer}
.anchart .col:disabled{cursor:default}
.anchart .col:not(:disabled):hover,.anchart .col.on{background:color-mix(in srgb,var(--brand) 9%,transparent)}
.anchart .col.on{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 60%,transparent)}
.anchart .stk{width:min(70%,42px);display:flex;flex-direction:column-reverse;gap:2px;border-radius:8px 8px 3px 3px;overflow:hidden;animation:anUp .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*40ms);transform-origin:bottom;min-height:0}
.anchart .stk i{display:block;min-height:2px}
.anchart .col.fut .stk{opacity:.35}
.anchart .v{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.anchart .x{position:absolute;bottom:4px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.anchart .pv{position:absolute;width:min(80%,50px);border-top:2px dashed var(--gold,#E2C47A);opacity:.8;pointer-events:none}
@keyframes anUp{from{transform:scaleY(0)}}
.anlist{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--soft2);color:var(--ink);box-shadow:inset 3px 0 0 var(--c)}
.hchip small{color:var(--muted);font-size:11.5px}
@media (max-width:900px){.anhero{grid-template-columns:1fr}.anchart{gap:4px;height:220px}.anchart .x{font-size:10px}}
@media (prefers-reduced-motion:reduce){.anchart .stk,.anhero .cat .ln i{animation:none}}
/* ---------- كفاءة المقاولين ---------- */
.cwnums button{display:flex;flex-direction:column;align-items:flex-start;font-size:12.5px;color:var(--muted);border:0;background:transparent;padding:4px 8px;margin:-4px -8px;border-radius:10px;cursor:pointer;font-family:inherit}
.cwnums button:hover:not(:disabled){background:var(--soft)}
.cwnums button:disabled{cursor:default}
.cwnums button.d b{color:var(--ok)}.cwnums button.p b{color:var(--ready)}
.cwnums .eff b{font-size:26px}
.effb{margin-inline-start:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:86px;padding:8px 10px;border-radius:14px;font-size:12px;font-weight:700;border:1px solid}
.effb b{font-family:'Readex Pro';font-size:20px;line-height:1.1}
.effb.bad,.eff.bad b{color:#FF7A8C}.effb.bad{background:rgba(255,90,114,.12);border-color:rgba(255,90,114,.45)}
.effb.ok1,.eff.ok1 b{color:#FF9F5A}.effb.ok1{background:rgba(255,159,90,.12);border-color:rgba(255,159,90,.45)}
.effb.ok2,.eff.ok2 b{color:#F2C14E}.effb.ok2{background:rgba(242,193,78,.12);border-color:rgba(242,193,78,.45)}
.effb.gd,.eff.gd b{color:#4FD8E8}.effb.gd{background:rgba(79,216,232,.12);border-color:rgba(79,216,232,.45)}
.effb.vg,.eff.vg b{color:#5BE3A8}.effb.vg{background:rgba(56,226,160,.12);border-color:rgba(56,226,160,.45)}
.effb.ex,.eff.ex b{color:#38E2A0}.effb.ex{background:rgba(56,226,160,.16);border-color:rgba(56,226,160,.6);box-shadow:0 0 18px -6px #38E2A0}
.cwk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cwk .ov b,.crow .cv.ov,.cs .cv.ov,.cwnums .o b{color:var(--gold,#E2C47A)}
.crow .cv.ov small{display:block;font-size:11px;font-weight:600;opacity:.85}
button.crow.co{background:color-mix(in srgb,var(--brand2,#8E7CFF) 8%,transparent)}button.crow.co .cn b{color:var(--brand2,#8E7CFF)}
.cwk .k{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;border:1px solid var(--line);background:var(--soft2);color:var(--muted);font-size:11.5px;line-height:1.25;text-align:center;cursor:pointer;font-family:inherit}
.cwk .k b{font-family:'Readex Pro';font-size:18px;color:var(--ink)}
.cwk .k:hover:not(:disabled){border-color:color-mix(in srgb,var(--brand) 55%,transparent)}
.cwk .k:disabled{opacity:.5;cursor:default}
.cwk .ratio{cursor:default}.cwk .ratio b{color:var(--brand)}.cwk .rd b{color:var(--ready)}.cwk .od b{color:var(--info)}.cwk .odr b{color:var(--ok)}.cwk .odn b{color:var(--notready)}
.effline{height:5px;border-radius:99px;background:rgba(255,90,114,.35);overflow:hidden}
.effline span{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--ok),var(--brand));border-radius:99px;animation:cwGrow .9s ease backwards;transform-origin:right}
/* ---------- فرز القوائم (مقاول / قطاع / فئة) ---------- */
.grpbar{display:inline-flex;align-items:center;gap:4px;padding:4px;border-radius:14px;background:var(--soft2);border:1px solid var(--line);margin:0 0 12px;flex-wrap:wrap;position:relative}
.grpbar .muted{font-size:12.5px;padding:0 8px 0 4px}
.gopt{height:32px;padding:0 13px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s}
.gopt:hover{color:var(--ink)}
.gopt.on{background:linear-gradient(135deg,var(--brand),#36A9E0);color:var(--brand-ink,#03141B);box-shadow:0 0 16px -6px var(--brand)}
.glist>*,.gbody>*{animation:gItem .42s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*22ms + var(--gi,0)*55ms)}
@keyframes gItem{from{opacity:0;transform:translateY(8px) scale(.985);filter:blur(3px)}}
.groups{display:flex;flex-direction:column;gap:12px}
.grp{border:1px solid var(--line);border-radius:16px;background:var(--soft2);overflow:hidden;animation:gGrp .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--gi)*55ms)}
@keyframes gGrp{from{opacity:0;transform:translateY(12px)}}
.ghead{display:grid;grid-template-columns:auto auto 1fr 22px;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;background:transparent;color:var(--ink);cursor:pointer;text-align:right;font-family:inherit}
.ghead:hover{background:var(--soft)}
.ghead .gt{font-family:'Reem Kufi','Readex Pro',sans-serif;font-weight:600;font-size:15.5px;white-space:nowrap}
.ghead .gc{min-width:30px;height:24px;padding:0 9px;border-radius:99px;background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--brand);font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.ghead .gbar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.ghead .gbar i{display:block;height:100%;width:var(--w);border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2,#8E7CFF));transform-origin:right;animation:cwGrow .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--gi)*55ms + .1s)}
.ghead .chev{color:var(--muted);transition:transform .3s ease}
.grp.col .ghead .chev{transform:rotate(90deg)}
.gbody{padding:0 12px 12px}
.gbody.anlist,.glist.anlist{display:flex;flex-wrap:wrap;gap:8px}
.rlist{display:flex;flex-direction:column;gap:8px}
.split>.l .grpbar{margin:0}.split>.l .grpbar .muted{display:none}.split>.l .gopt{padding:0 9px;font-size:12.5px}
.split>.l .groups{gap:8px}.split>.l .ghead{padding:9px 12px}.split>.l .gbody{padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){.glist>*,.gbody>*,.grp,.ghead .gbar i{animation:none}}
/* ---------- كفاءة المقاولين: خريطة + ترتيب + تفاصيل ---------- */
.cwtop{display:flex;flex-direction:column;gap:12px}
.cwtop .cwnums{justify-content:space-between}
.cwmap h2 small{font-size:12px}
.cwsvg{width:100%;height:auto;display:block;overflow:visible}
.cwsvg .gl{stroke:var(--line);stroke-width:1}
.cwsvg .ax{fill:var(--muted);font-size:12px}
.cwsvg .axl{fill:var(--muted);font-size:12.5px;font-weight:600}

/* ================= هوية "المستقبل": كحلي فضائي + سماوي هولوغرامي + لمسة ذهب الشعار ================= */
:root[data-mode]{
  --bg:#060A18; --card:rgba(16,26,54,.66); --card-solid:#0E1730; --ink:#E6F0FF; --muted:#8C9FC6; --line:rgba(110,170,255,.17); --soft:rgba(110,170,255,.08); --soft2:rgba(110,170,255,.05);

  --brand:#4FD8E8; --brand-ink:#03141B; --brand2:#8E7CFF; --gold:#E2C47A;
  --ready:#F2B23E; --ready-bg:rgba(242,178,62,.15); --ready-fg:#FFD27D;
  --notready:#FF5A72; --notready-bg:rgba(255,90,114,.14); --notready-fg:#FF9DAB;
  --review:#A98BFF; --ok:#38E2A0; --ok-bg:rgba(56,226,160,.12); --info:#68B6FF; --info-bg:rgba(104,182,255,.12);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -24px rgba(0,0,0,.8);
  --glow1:rgba(79,216,232,.16); --glow2:rgba(142,124,255,.18); --gridc:rgba(110,170,255,.045);
  color-scheme:dark;
}
:root[data-mode="day"]{
  --bg:#0E1B3E; --card:rgba(28,46,92,.6); --card-solid:#16264D; --muted:#9DB1D8; --line:rgba(140,190,255,.2);

}

/* ---------- شاشة الافتتاح ---------- */
#splash{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:radial-gradient(60% 50% at 50% 45%,rgba(79,216,232,.16),transparent 70%),#050913;transition:opacity .55s ease,filter .55s ease;cursor:pointer}
#splash.out{opacity:0;filter:blur(10px);pointer-events:none}
#splash .emb{position:relative;width:168px;height:168px}
#splash svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#splash svg circle{fill:none;stroke-width:2;stroke-linecap:round}
#splash .r1{stroke:url(#spg);stroke-dasharray:503;stroke-dashoffset:503;animation:spDraw 1.3s cubic-bezier(.6,0,.2,1) .1s forwards}
#splash .r2{stroke:rgba(79,216,232,.25);stroke-dasharray:2 8;animation:spIn .6s ease 1s backwards}
#splash .seal{position:absolute;inset:22px;border-radius:50%;background:#FBF8EF;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 60px -6px rgba(79,216,232,.55);animation:spSeal .9s ease .55s backwards}
#splash .seal img{width:84%;height:84%;object-fit:contain}
#splash b{font-family:'Reem Kufi','Readex Pro',sans-serif;font-weight:600;font-size:28px;color:#E6F0FF;animation:spUp .7s ease .95s backwards}
#splash small{color:#7FDCE9;font-size:14px;animation:spUp .7s ease 1.15s backwards}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spIn{from{opacity:0}}
@keyframes spSeal{from{opacity:0;filter:blur(12px);transform:scale(.8)}}
@keyframes spUp{from{opacity:0;filter:blur(6px);transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}

.rsstats .card{padding:12px 14px;display:flex;flex-direction:column;gap:2px;animation:rsin .4s both}
.rsstats .card b{font-size:24px;color:var(--brand);font-variant-numeric:tabular-nums}
.rsstats .card span{font-size:12.5px;color:var(--muted)}
.rstbl td{font-size:13.5px}
.rstbl tbody tr{animation:rsin .35s both;animation-delay:calc(var(--i,0) * 25ms)}
.rstbl tbody tr:hover td{background:var(--soft)}
.rsn{display:inline-grid;place-items:center;min-width:32px;height:32px;border-radius:50%;font-weight:800;color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.rsrounds{display:flex;flex-direction:column;gap:4px;min-width:220px}
.rsr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;padding:3px 8px;border-radius:8px;background:var(--soft)}
.rsr i{font-style:normal;font-weight:800;color:var(--brand2,var(--brand))}
.rsr em{font-style:normal;margin-inline-start:auto;font-weight:700;color:var(--gold,var(--brand))}
.rsdr{direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rsr .rsdr{color:inherit}
.rstot{font-size:18px;color:var(--gold,var(--brand))}
@keyframes rsin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rsstats .card,.rstbl tbody tr{animation:none}}
</style>
</head>

  <aside id="rail" aria-label="القائمة الرئيسية"></aside>
  <div id="main">
    <header id="topbar"></header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast" aria-live="polite"></div>
